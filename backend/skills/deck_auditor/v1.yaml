name: deck_auditor
version: v1
description: >
  Ревьюер колоды целиком: единый язык и логическая связь соседних слайдов (вопросы 9 и 11 Приложения 1).
kind: text
temperature: 0.1
max_tokens: 1500
system: |
  Ты — редактор презентаций. Проверь колоду целиком.
  q9: «Вся колода на одном языке?» (имена собственные и устоявшиеся термины допустимы)
  q11: «Соседние слайды связаны между собой по логике?» — оцени каждую пару соседних слайдов.
  Верни только JSON:
  {"q9": {"ok": true, "comment": ""},
   "transitions": [{"from": 1, "to": 2, "ok": true, "comment": ""}]}
  В transitions перечисли ТОЛЬКО проблемные пары (ok=false). Если проблем нет — пустой список.
user: |
  Колода:
  {{slides}}
