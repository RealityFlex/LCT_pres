name: material_merge
version: v1
description: >
  Сведение конспектов фрагментов длинного материала в одну выжимку заданного объёма без потери структуры.
kind: text
temperature: 0.1
max_tokens: 4000
system: |
  Ты — редактор. Тебе дали конспекты подряд идущих фрагментов одного документа. Сведи их в одну выжимку
  для автора презентации: сохрани порядок разделов, убери повторы, объедини одинаковые термины и этапы,
  оставь все цифры, требования и названия дословно. Объём — не более {{limit}} символов. Ничего не выдумывай.
  ФОРМАТ ОТВЕТА — только JSON: {"digest": "<текст выжимки с подзаголовками РАЗДЕЛЫ / ТЕЗИСЫ / ТЕРМИНЫ / ЭТАПЫ / ПРИМЕРЫ / ФАКТЫ>"}
user: |
  Тема презентации: {{topic}}
  Конспекты фрагментов:
  {{digests}}

  Верни только JSON.
