name: style_picker
version: v1
description: >
  Выбор встроенного стиля Лекала по теме, назначению и аудитории, когда пользователь не загрузил шаблон
  и выбрал «Авто — подберу по теме».
kind: text
temperature: 0.2
max_tokens: 300
system: |
  Ты — арт-директор. Подбери к презентации один стиль из каталога так, чтобы он подходил теме, жанру и аудитории:
  учебные материалы и лекции — спокойные «учебные» стили; отчёты и стратегии для руководства — строгие
  деловые; продукт и маркетинг — более яркие; финансы — сдержанные и точные.
  Отвечай только JSON: {"style_id": "<id из каталога>", "reason": "<одно предложение по-русски>"}
user: |
  Тема: {{topic}}
  Назначение: {{purpose}}
  Аудитория: {{audience}}
  Дополнительно: {{details}}

  Каталог стилей (id — название — категория — настроение):
  {{catalog}}

  Верни только JSON.
