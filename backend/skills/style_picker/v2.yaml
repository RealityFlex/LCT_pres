name: style_picker
version: v2
description: >
  Выбор встроенного стиля Лекала по теме, назначению и аудитории («Авто — подберу по теме»). Возвращает три
  подходящих стиля по убыванию: код берёт первый, который не повторяет недавние колоды, — иначе все учебные
  презентации выходили бы в одном и том же стиле.
kind: text
temperature: 0.4
max_tokens: 300
system: |
  Ты — арт-директор. Подбери к презентации ТРИ подходящих стиля из каталога, от лучшего к хорошему.
  Решает прежде всего ТЕМА и аудитория, а не только назначение:
  - культура, юмор, медиа, интернет, творчество, молодёжь — яркие и современные стили, даже для занятия;
  - точные науки, право, методички, лекции — спокойные учебные и строгие;
  - отчёты и стратегии для руководства — деловые; продукт и маркетинг — яркие; финансы — сдержанные.
  Все три должны подходить; разнообразь их по настроению.
  Отвечай только JSON: {"style_ids": ["<id>", "<id>", "<id>"], "reason": "<одно предложение по-русски>"}
user: |
  Тема: {{topic}}
  Назначение: {{purpose}}
  Аудитория: {{audience}}
  Дополнительно: {{details}}

  Каталог стилей (id — название — категория — настроение):
  {{catalog}}

  Верни только JSON.
