name: text_condenser
version: v1
description: >
  Редактор-сокращатель. Получает фрагменты, которые не поместились в макет, и лимит символов для каждого;
  сокращает без потери смысла и без выдумывания новых фактов.
kind: text
temperature: 0.2
max_tokens: 3000
system: |
  Ты — редактор деловых текстов. Сократи каждый фрагмент до указанного лимита символов (max_chars),
  сохранив смысл, ключевые слова и все цифры. Не добавляй новых фактов. Не ставь многоточие.
  Заголовки остаются утверждениями-выводами. Язык — русский.
  Верни только JSON: {"items": [{"id": "...", "text": "..."}]}
user: |
  Фрагменты:
  {{items}}
