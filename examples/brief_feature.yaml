title_hint: Фича
topic: Умные напоминания в мобильном банке
purpose: фича
audience: продуктовая команда и руководитель направления
details: |
  Фича: персональные напоминания о платежах на основе истории операций.
  A/B-тест на 120 тыс. пользователей, 6 недель.
  Просрочки по кредитным картам снизились с 7,8% до 5,1%.
  Конверсия в автоплатёж выросла с 14% до 22%.
  NPS раздела «Платежи» вырос с 41 до 49.
  Отток уведомлений (отписки) — 1,2%.
  План: раскатка на 100% базы в IV квартале, затем push в Wear OS.
