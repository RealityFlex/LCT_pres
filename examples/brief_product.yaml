title_hint: Продукт
topic: Облачная платформа видеосвязи для бизнеса
purpose: продукт
audience: коммерческие директора крупных компаний
details: |
  Продукт: защищённые видеовстречи до 1000 участников, запись, расшифровка и конспект встречи.
  Размещение в российском облаке, соответствие 152-ФЗ.
  Средняя задержка звука 120 мс.
  Выручка по кварталам 2025 (млн руб.): I — 34; II — 41; III — 52; IV — 67.
  Клиентов: 380 компаний, удержание 94%.
  Тарифы: Команда 490 руб./польз., Бизнес 890 руб./польз., Корпорация — по запросу.
