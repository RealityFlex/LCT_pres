title_hint: Проект
topic: Внедрение платформы «Умный склад» в розничной сети
purpose: проект
audience: совет директоров
details: |
  Пилот на складе в Москве, январь–июнь 2026.
  Время сборки заказа снизилось с 4,5 до 1,5 часа.
  Точность учёта выросла с 91% до 99,2%.
  Потери выручки из-за пересортицы сократились с 12% до 3%.
  Бюджет проекта 48 млн руб., окупаемость 9 месяцев.
  План: 12 складов до конца 2026 года. Внедрение на один склад занимает 10 недель.
  Время сборки по месяцам (ч): янв 4,5; фев 4,2; мар 3,1; апр 2,2; май 1,7; июн 1,5.
  Риски: сопротивление персонала, интеграция с 1С, качество справочников.
