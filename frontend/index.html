<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="description" content="Лекало — цифровой дизайнер презентаций: читает корпоративный шаблон как дизайн-систему и собирает три варианта колоды с аудитом каждого слайда." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Лекало — цифровой дизайнер презентаций</title>
    <script>
      // тема до первой отрисовки — без вспышки
      try {
        var m = localStorage.getItem("lekalo-theme") || "auto";
        var d = m === "auto" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : m;
        document.documentElement.dataset.theme = d;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
